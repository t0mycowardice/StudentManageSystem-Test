[pytest]
; -s：显示 print 输出；--alluredir：指定 allure 结果目录；--clean-alluredir：每次执行前清空
addopts = -s --alluredir=report --clean-alluredir
testpaths = ./script
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; 模块标记（-m login 即可只跑登录模块）
markers =
    login: 登录模块
    student: 学生管理模块
    teacher: 教师管理模块
    course: 课程管理模块
    security: 安全测试用例
